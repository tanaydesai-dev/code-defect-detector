experiment_name: frozen_codebert_baseline
seed: 42

dataset:
  name: google/code_x_glue_cc_defect_detection
  revision: main
  text_column: func
  label_column: target

model:
  name: microsoft/codebert-base
  freeze_encoder: true
  max_length: 512
  dropout: 0.1

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 10

